# Render Blueprint for Bifrost (ai-jura) — kommunal AI-compliance-platform.
# Deployer: FastAPI-backend (Docker) + React-frontend (static site) + managed Postgres.
#
# Engangs-opsætning: forbind dette repo som et "Blueprint" i Render-dashboardet
# og indsæt din OPENAI_API_KEY når du bliver spurgt. Se RENDER_DEPLOY.md.

databases:
  - name: ai-jura-db
    databaseName: bifrost
    user: bifrost
    plan: free                 # udløber efter ~90 dage — opgradér til basic-256mb for varig drift
    region: frankfurt          # EU-region (GDPR / dansk forvaltning)
    postgresMajorVersion: "16"

services:
  # ---- FastAPI backend (Docker) ----
  - name: ai-jura-backend
    type: web
    runtime: docker
    plan: free                 # gratis: 512 MB, spinner ned ved inaktivitet (~30-60 s koldstart). Bump til starter/standard for altid-på + mere RAM
    region: frankfurt
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /api/version
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-jura-db
          property: connectionString
      # --- Gemini via OpenAI-kompatibelt endpoint (ingen ny dependency) ---
      - key: OPENAI_API_KEY
        sync: false            # = din GEMINI API-nøgle (aistudio.google.com → "Get API key")
      - key: OPENAI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: OPENAI_API_BASE
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: OPENAI_MODEL
        value: gemini-2.5-flash
      - key: DEFAULT_LLM_MODEL
        value: gemini-2.5-flash
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: API_HOST
        value: 0.0.0.0
      - key: API_RELOAD
        value: "false"
      - key: STRICT_CONFIG_VALIDATION
        value: "false"         # kun DB er kritisk; tillad boot selv hvis SMTP/Qdrant mangler
      - key: ENABLE_CACHING
        value: "true"
      - key: CACHE_DIR
        value: /app/.cache
      - key: NOTIFICATION_DIGEST_ENABLED
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: LOG_LEVEL
        value: INFO

  # ---- React frontend (static site) ----
  - name: ai-jura-frontend
    type: web
    runtime: static
    # static sites har ingen plan — de er altid gratis (Render afviser et plan-felt her)
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/build
    envVars:
      - key: NODE_VERSION
        value: "18"            # react-scripts 5 bygger rent på Node 18 (undgår webpack/OpenSSL-fejl)
      - key: CI
        value: "false"         # Render sætter CI=true → react-scripts ville fejle på warnings
      - key: REACT_APP_API_BASE_URL
        # Backendens offentlige URL — bages ind i bundlet ved build.
        # Hvis Render giver backenden et andet navn end "ai-jura-backend",
        # ret denne værdi og redeploy frontend'en. Se RENDER_DEPLOY.md.
        value: https://ai-jura-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
